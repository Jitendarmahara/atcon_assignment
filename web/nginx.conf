server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Mirrors vite.config.ts's dev-server proxy exactly - the built app always
  # calls relative /api/v1/... paths (see src/lib/api.ts, src/lib/
  # candidateApi.ts), assuming whatever serves it also fronts the API on the
  # same origin. `api` resolves via Docker Compose's internal DNS to the API
  # container - see docker-compose.prod.yml.
  location /api/v1/ {
    proxy_pass http://api:4000/api/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # A client-side route (e.g. /app/candidates/123) has no matching file on
  # disk - without this fallback, a direct load or browser refresh on any
  # route but "/" 404s at the web server before React Router ever runs.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
