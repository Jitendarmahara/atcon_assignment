name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PNPM_VERSION: "11.22.0"
  NODE_VERSION: "20"

jobs:
  server:
    name: Server (typecheck + test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ats
          POSTGRES_PASSWORD: ats
          POSTGRES_DB: ats_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ats"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ats:ats@localhost:5432/ats_test?schema=public
      SCOPED_DATABASE_URL: postgresql://ats_app:ats_app_password_dev_only@localhost:5432/ats_test?schema=public
      REDIS_URL: redis://localhost:6379/1
      JWT_ACCESS_SECRET: ci-access-secret-not-for-prod-use
      JWT_REFRESH_SECRET: ci-refresh-secret-not-for-prod-use
      WEB_ORIGIN: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        working-directory: server
        run: npx prisma migrate deploy

      - name: Typecheck
        working-directory: server
        run: pnpm lint

      - name: Test
        working-directory: server
        run: pnpm test

  web:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: web
        run: pnpm lint

      - name: Build
        working-directory: web
        run: pnpm build
